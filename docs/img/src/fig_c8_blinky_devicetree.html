<!doctype html>
<!--
  2.4節の図（blinky: アプリ・デバイスツリー・Kconfig・ドライバの関係）．3.3節の fig_c5 と同じ配色．
  PNG にするには（macOS）:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --hide-scrollbars --force-device-scale-factor=2 --window-size=1260,910 \
      --virtual-time-budget=5000 --screenshot=docs/img/fig_c8_blinky_devicetree.png \
      "file://$PWD/docs/img/src/fig_c8_blinky_devicetree.html"
  内容は Zephyr main（2026-11-03）の samples/basic/blinky と boards/nxp/frdm_mcxn947 で確認．
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  svg { display: block; }
  text { font-family: "Noto Sans JP", "Hiragino Sans", sans-serif; font-size: 14px; fill: #333; }
  .mono { font-family: "Noto Sans Mono", Menlo, monospace; }
  .code { font-family: "Noto Sans Mono", Menlo, monospace; font-size: 15px; fill: #222; white-space: pre; }
  .path { font-family: "Noto Sans Mono", Menlo, monospace; font-size: 13px; fill: #666; }
  .h { font-size: 21px; font-weight: 700; }
  .sub { font-size: 14px; fill: #555; }
  .b  { font-weight: 700; }
  .blue { fill: #2c6fd1; } .green { fill: #2e9348; } .orange { fill: #dd8526; }
  .purple { fill: #7a4cc4; } .gray { fill: #555; }
  .badge text { fill: #fff; font-weight: 700; font-size: 14px; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="910" viewBox="0 0 1260 910">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2c6fd1"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e9348"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dd8526"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a4cc4"/></marker>
  </defs>

  <!-- ============ アプリケーション ============ -->
  <rect x="100" y="25" width="1120" height="140" rx="10" fill="#e9f0fc" stroke="#2c6fd1" stroke-width="2"/>
  <text x="120" y="60" class="h blue">アプリケーション</text>
  <text x="312" y="60" class="path">src/main.c</text>
  <text x="120" y="96"  class="code">#define LED0_NODE DT_ALIAS(led0)</text>
  <text x="120" y="122" class="code">static const struct gpio_dt_spec led = GPIO_DT_SPEC_GET(LED0_NODE, gpios);</text>
  <text x="120" y="148" class="code">gpio_pin_configure_dt(&amp;led, GPIO_OUTPUT_ACTIVE);  gpio_pin_toggle_dt(&amp;led);</text>
  <rect x="870" y="72" width="330" height="72" rx="8" fill="none" stroke="#2c6fd1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1035" y="102" class="blue" text-anchor="middle">どのLEDが，どのピンに</text>
  <text x="1035" y="126" class="blue" text-anchor="middle">つながっているかは書いていない</text>


  <!-- ============ デバイスツリー ============ -->
  <rect x="100" y="205" width="700" height="380" rx="10" fill="#e8f5ec" stroke="#2e9348" stroke-width="2"/>
  <text x="120" y="238" class="h green">デバイスツリー</text>
  <text x="275" y="238" class="sub">どの部品が，どこにつながっているか</text>

  <rect x="118" y="252" width="664" height="212" rx="8" fill="#fff" stroke="#2e9348" stroke-width="1.5"/>
  <text x="134" y="278" class="green b">ボードのデバイスツリー（Zephyr本体側）</text>
  <text x="420" y="278" class="path">zephyr/boards/nxp/frdm_mcxn947/</text>
  <text x="134" y="302" class="path">frdm_mcxn947.dtsi（抜粋）</text>
  <rect x="128" y="312" width="282" height="24" rx="3" fill="#fff3a8"/>
  <text x="134" y="330" class="code">aliases { led0 = &amp;red_led; };</text>
  <g class="badge"><circle cx="430" cy="324" r="13" fill="#2c6fd1"/><text x="430" y="324">A</text></g>
  <text x="134" y="354" class="code">red_led: led_3 {</text>
  <rect x="160" y="360" width="340" height="24" rx="3" fill="#fff3a8"/>
  <text x="134" y="378" class="code">    gpios = &lt;&amp;gpio0 10 GPIO_ACTIVE_LOW&gt;;</text>
  <g class="badge"><circle cx="520" cy="372" r="13" fill="#2e9348"/><text x="520" y="372">B</text></g>
  <text x="134" y="402" class="code">    label = "Red LED";</text>
  <text x="134" y="426" class="code">};</text>
  <text x="134" y="452" class="sub">cpu0 用の frdm_mcxn947_mcxn947_cpu0.dtsi で status = "okay"（有効）にしている</text>

  <!-- B: gpio0 の10番ピン -->
  <line x1="250" y1="464" x2="250" y2="492" stroke="#2e9348" stroke-width="2.5" marker-end="url(#ag)"/>
  <g class="badge"><circle cx="280" cy="478" r="13" fill="#2e9348"/><text x="280" y="478">B</text></g>
  <text x="302" y="483" class="green b">GPIO0 の10番ピンを指す</text>

  <rect x="118" y="494" width="664" height="76" rx="8" fill="none" stroke="#2e9348" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="134" y="520" class="green b">マイコン（SoC）のデバイスツリー（Zephyr本体側）</text>
  <text x="500" y="520" class="path">zephyr/dts/arm/nxp/mcx/mcxn/</text>
  <rect x="128" y="532" width="545" height="24" rx="3" fill="#fff3a8"/>
  <text x="134" y="550" class="code">gpio0: gpio@96000 { compatible = "nxp,kinetis-gpio"; ... };</text>

  <text x="782" y="238" class="sub" text-anchor="end">アプリ側のオーバーレイはなし</text>

  <!-- A: エイリアスで探す -->
  <line x1="560" y1="165" x2="560" y2="249" stroke="#2c6fd1" stroke-width="2.5" marker-end="url(#ab)"/>
  <g class="badge"><circle cx="588" cy="187" r="13" fill="#2c6fd1"/><text x="588" y="187">A</text></g>
  <text x="610" y="192" class="blue b">名前（エイリアス）で探す</text>

  <!-- C: compatible でドライバが決まる -->
  <line x1="660" y1="570" x2="660" y2="628" stroke="#2e9348" stroke-width="2.5" marker-end="url(#ag)"/>
  <g class="badge"><circle cx="690" cy="606" r="13" fill="#2e9348"/><text x="690" y="606">C</text></g>
  <text x="712" y="611" class="green b">compatible でドライバが決まる</text>

  <!-- ============ Kconfig ============ -->
  <rect x="840" y="205" width="380" height="380" rx="10" fill="#fdf3e7" stroke="#dd8526" stroke-width="2"/>
  <text x="860" y="238" class="h orange">Kconfig</text>
  <text x="950" y="238" class="sub">どの機能を使うか</text>
  <rect x="858" y="252" width="344" height="92" rx="8" fill="#fff" stroke="#dd8526" stroke-width="1.5"/>
  <text x="874" y="280" class="mono orange b">prj.conf</text>
  <text x="874" y="312" class="code">CONFIG_GPIO=y</text>
  <text x="1020" y="312" class="sub">（blinkyはこの1行だけ）</text>
  <line x1="1030" y1="344" x2="1030" y2="400" stroke="#dd8526" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="1044" y="377" class="orange b">自動で有効になる</text>
  <rect x="858" y="402" width="344" height="158" rx="8" fill="none" stroke="#dd8526" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="874" y="452" class="code">CONFIG_GPIO_MCUX=y</text>
  <text x="874" y="488">デバイスツリーで nxp,kinetis-gpio の</text>
  <text x="874" y="514">GPIO（gpio0）が有効なので</text>
  <!-- SoC の gpio0 → Kconfig（点線） -->
  <line x1="782" y1="532" x2="856" y2="532" stroke="#dd8526" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#ao)"/>

  <!-- D: ビルドに含める -->
  <line x1="1030" y1="585" x2="1030" y2="628" stroke="#dd8526" stroke-width="2.5" marker-end="url(#ao)"/>
  <g class="badge"><circle cx="1058" cy="606" r="13" fill="#dd8526"/><text x="1058" y="606">D</text></g>
  <text x="1080" y="611" class="orange b">ビルドに含める</text>

  <!-- ============ ドライバ ============ -->
  <rect x="100" y="630" width="1120" height="78" rx="10" fill="#f1ecfb" stroke="#7a4cc4" stroke-width="2"/>
  <text x="120" y="662" class="h purple">GPIOのドライバ</text>
  <text x="300" y="662" class="path">zephyr/drivers/gpio/gpio_mcux.c</text>
  <text x="120" y="692">GPIOのレジスタ操作など，マイコン固有の処理はすべてここにある（アプリは書かなくてよい）</text>


  <!-- ============ ハードウェア ============ -->
  <rect x="100" y="760" width="1120" height="96" rx="10" fill="#eef0f3" stroke="#5f6670" stroke-width="2"/>
  <text x="120" y="792" class="h gray">ハードウェア</text>
  <text x="270" y="792" class="sub">FRDM-MCXN947</text>
  <rect x="400" y="780" width="260" height="60" rx="6" fill="#fff" stroke="#5f6670" stroke-width="1.5"/>
  <text x="530" y="806" class="b" text-anchor="middle" style="font-size:16px">MCX N947</text>
  <text x="530" y="828" class="sub" text-anchor="middle">GPIO0 コントローラ</text>
  <line x1="660" y1="810" x2="880" y2="810" stroke="#5f6670" stroke-width="3"/>
  <text x="770" y="800" class="sub" text-anchor="middle">10番ピン</text>
  <rect x="880" y="780" width="260" height="60" rx="6" fill="#fff" stroke="#5f6670" stroke-width="1.5"/>
  <text x="1010" y="806" class="b" text-anchor="middle" style="font-size:16px">RGB LED の赤</text>
  <text x="1010" y="828" class="sub" text-anchor="middle">（図1の③）</text>


  <!-- E: ピンを操作 -->
  <line x1="530" y1="708" x2="530" y2="778" stroke="#7a4cc4" stroke-width="2.5" marker-end="url(#ap)"/>
  <g class="badge"><circle cx="558" cy="738" r="13" fill="#7a4cc4"/><text x="558" y="738">E</text></g>
  <text x="580" y="743" class="purple b">GPIO0 の10番ピンを操作する</text>

  <!-- F: 実行時は GPIO API でドライバを呼ぶ -->
  <path d="M100,110 H55 V669 H96" fill="none" stroke="#2c6fd1" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ab)"/>
  <g class="badge"><circle cx="55" cy="390" r="13" fill="#2c6fd1"/><text x="55" y="390">F</text></g>
  <text transform="translate(28,390) rotate(-90)" class="blue" text-anchor="middle">実行時はGPIOのAPIでドライバを呼ぶ</text>

  <!-- まとめ -->
  <text x="660" y="892" class="b" text-anchor="middle" style="font-size:16px">アプリ（main.c）は led0 という名前しか知らない．どのLEDを光らせるかは，ボードのデバイスツリーが決めている</text>
</svg>
</body>
</html>
